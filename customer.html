<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Customer - Yanoshi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --theme-silver: #E0E0E0; 
            --theme-white: #FFFFFF;
            --grad-black: linear-gradient(135deg, #2b2b2b 0%, #121212 50%, #000000 100%);
            --text-dark: #F3F1EA; 
            --text-mid: #A9A6A0;
            --border-soft: rgba(255,255,255,0.08); 
            --border-theme: rgba(255,255,255,0.25);
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(180deg, #18181c 0%, #0e0e10 100%); 
            color: var(--text-dark); 
            min-height: 100vh; 
        }
        [x-cloak] { display: none !important; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #ffffff 0%, #d4d4d4 100%); border-radius: 3px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .icon-svg { display: inline-block; vertical-align: middle; }

        /* OVERRIDES TEMA MODAL / KOTAK INPUT */
        .yanoshi-app .bg-white { background-color: #1b1b20 !important; }
        .yanoshi-app .text-gray-600, .yanoshi-app .text-gray-500 { color: var(--text-mid) !important; }
        .yanoshi-app .text-gray-400 { color: #8a8985 !important; }
        .yanoshi-app .border { border-color: rgba(255,255,255,0.10) !important; }
        .yanoshi-app input[type="text"], .yanoshi-app select { background-color: rgba(255,255,255,0.04) !important; border-color: rgba(255,255,255,0.14) !important; color: var(--text-dark) !important; }
        .yanoshi-app input:focus, .yanoshi-app select:focus { border-color: #fff !important; }
        .yanoshi-app option { background: #1b1b20; color: var(--text-dark); }

        /* Toast Container */
        #toastContainer { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { padding: 12px 18px; border-radius: 12px; color: white; font-size: 13px; font-weight: 600; font-family: 'Montserrat', sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: auto; animation: toastIn 0.3s ease-out; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast.error   { background: linear-gradient(135deg, #5c0000, #990000); }
    </style>
</head>
<body x-data="statusCustomerApp()" x-init="initStatus()">

    <div id="toastContainer"></div>

    <!-- HEADER STICKY BARU (BERISI SEMUA FILTER) -->
    <div class="sticky top-0 z-50 p-3 sm:p-4 bg-[#131315] border-b border-[rgba(255,255,255,0.1)] shadow-lg flex flex-col gap-3 w-full">
        
        <!-- Baris 1: Judul dan Kolom Input Text -->
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 w-full">
            <h2 class="text-xs sm:text-sm font-black text-white uppercase tracking-widest border-l-4 border-yellow-500 pl-2 shrink-0">
                Status Customer
            </h2>
            
            <div class="flex gap-2 w-full sm:w-auto">
                <div class="relative flex-1 sm:w-48">
                    <input type="text" x-model="scSearchNama" placeholder="Cari nama..." class="w-full pl-8 pr-3 py-2 border border-[rgba(255,255,255,0.15)] rounded-lg outline-none transition text-xs font-medium bg-[#0a0a0c] text-white focus:border-yellow-500 shadow-inner">
                    <svg class="absolute left-2.5 top-2.5 text-gray-500" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <div class="relative flex-1 sm:w-36">
                    <input type="text" x-model="scSearchTanggal" placeholder="Tgl (Ex: 17 Jul)" class="w-full pl-8 pr-3 py-2 border border-[rgba(255,255,255,0.15)] rounded-lg outline-none transition text-xs font-medium bg-[#0a0a0c] text-white focus:border-yellow-500 shadow-inner">
                    <svg class="absolute left-2.5 top-2.5 text-gray-500" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
            </div>
        </div>

        <!-- Baris 2: Dropdown Pilihan (Bisa di-swipe ke samping di HP) -->
        <div class="flex items-center gap-2 w-full overflow-x-auto no-scrollbar pb-1 sm:pb-0">
            
            <select x-model="scFilterSheet" class="shrink-0 w-[120px] sm:w-auto px-3 py-2 border border-[rgba(255,255,255,0.2)] rounded-lg outline-none transition text-[10px] sm:text-xs font-extrabold uppercase tracking-wider cursor-pointer bg-[#1b1b20] text-gray-300 focus:border-yellow-500 shadow-sm">
                <option value="">Semua Sheet</option>
                <template x-for="sh in availableSheets" :key="sh">
                    <option :value="sh" x-text="sh"></option>
                </template>
            </select>
            
            <select x-model="scFilterDari" class="shrink-0 w-[110px] sm:w-auto px-3 py-2 border border-[rgba(255,255,255,0.2)] rounded-lg outline-none transition text-[10px] sm:text-xs font-extrabold uppercase tracking-wider cursor-pointer bg-[#1b1b20] text-gray-300 focus:border-yellow-500 shadow-sm">
                <option value="">Semua Asal</option>
                <option value="exata">Exata</option><option value="jastip">Jastip</option><option value="LPK">LPK</option>
                <option value="senior">Senior</option><option value="Affiliate">Affiliate</option><option value="IG">IG</option>
                <option value="FB">FB</option><option value="tiktok">Tiktok</option><option value="chatbot">Chatbot</option><option value="web">Web</option>
            </select>

            <select x-model="scFilterStatus" class="shrink-0 w-[160px] sm:w-auto px-3 py-2 border border-[rgba(255,255,255,0.2)] rounded-lg outline-none transition text-[10px] sm:text-xs font-extrabold uppercase tracking-wider cursor-pointer bg-[#1b1b20] text-yellow-500 focus:border-yellow-500 shadow-sm">
                <option value="" class="text-white">Semua Status</option>
                <option value="sudah kirim" class="text-white">✅ Sudah Kirim</option>
                <option value="kirim hari ini" class="text-white">📦 Kirim Hari Ini</option>
                <option value="belum di kirim" class="text-white">💰 Sdh Bayar (Blm Kirim)</option>
                <option value="belum bayar" class="text-white">⏳ Belum Bayar</option>
                <option value="kirim jepang" class="text-white">✈️ Kirim Jepang</option>
                <option value="cancel" class="text-white">❌ Cancel</option>
            </select>

        </div>
    </div>

    <!-- WADAH UTAMA APLIKASI -->
    <div class="yanoshi-app p-4 md:p-6 w-full flex-1 relative">
        
        <!-- Indikator Loading -->
        <div x-show="statusAppLoading" class="flex flex-col justify-center items-center py-16" x-cloak>
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-500 mb-4"></div>
            <p class="font-bold text-sm" style="color:var(--text-mid);">Mengambil data customer...</p>
        </div>

        <!-- GRID KARTU CUSTOMER -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 pb-10" x-show="!statusAppLoading" x-cloak>
            <template x-for="c in filteredStatusData" :key="c.nama + c.sheetName">
                <div :class="getCardColor(c.statusCustomer)" class="rounded-xl shadow-sm border p-5 flex flex-col gap-3 relative break-words transition-all hover:shadow-md">
                    
                    <div class="flex justify-between items-start border-b pb-2 mb-1" style="border-color: rgba(0,0,0,0.1);">
                        <span class="text-[10px] font-extrabold uppercase tracking-widest opacity-70" :style="c.statusCustomer === 'belum bayar' ? 'color: rgba(255,255,255,0.7);' : 'color: rgba(0,0,0,0.6);'" x-text="'SHEET: ' + c.sheetName"></span>
                        <span class="text-[10px] font-extrabold uppercase px-2 py-1 rounded-md shadow-sm" :style="c.statusCustomer === 'belum bayar' ? 'background: rgba(255,255,255,0.1); color: white;' : 'background: rgba(255,255,255,0.5); color: #1a1a1a;'" x-text="c.statusCustomer"></span>
                    </div>

                    <div>
                        <h3 class="font-extrabold text-lg uppercase leading-tight" :style="c.statusCustomer === 'belum bayar' ? 'color: white;' : 'color: #1a1a1a;'" x-text="c.nama || 'Tanpa Nama'"></h3>
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            <template x-for="d in c.dari"><span :class="getPillColor(d)" class="px-2.5 py-0.5 rounded-md text-[10px] font-bold text-white uppercase tracking-wider shadow-sm" x-text="d"></span></template>
                        </div>
                        <div class="text-[11px] font-bold mt-3" :style="c.statusCustomer === 'belum bayar' ? 'color: rgba(255,255,255,0.8);' : 'color: rgba(0,0,0,0.7);'">
                            Progress: <span class="font-extrabold uppercase tracking-wide" :style="c.statusCustomer === 'belum bayar' ? 'color: #fff;' : 'color: #1a1a1a;'" x-text="c.progress"></span>
                        </div>
                    </div>

                    <div class="mt-auto pt-4 border-t flex justify-between items-center" style="border-color: rgba(0,0,0,0.1);">
                        <div class="text-[10px] font-bold flex flex-col uppercase tracking-wide">
                            <span :style="c.statusCustomer === 'belum bayar' ? 'color: rgba(255,255,255,0.7);' : 'color: rgba(0,0,0,0.7);'">Tgl Kirim:</span>
                            <span class="text-xs font-extrabold" :style="c.statusCustomer === 'belum bayar' ? 'color: white;' : 'color: #1a1a1a;'" x-text="c.tglKirim || '-'"></span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button @click="bukaModalSiapkan(c.nama)" class="px-3 py-2 rounded-lg text-[10px] font-black uppercase tracking-wider transition shadow-sm active:scale-95" style="background: var(--grad-black); color: white; border: 1px solid rgba(255,255,255,0.2);">Siapkan</button>
                        </div>
                    </div>
                </div>
            </template>
            
            <div x-show="filteredStatusData.length === 0" class="col-span-full text-center py-12">
                <span class="text-4xl mb-2 block">📭</span>
                <div class="text-[13px] font-bold text-gray-400 uppercase tracking-widest">Data tidak ditemukan</div>
            </div>
        </div>
        
        <!-- MODAL SIAPKAN / VERIFIKASI PACKING -->
        <div x-show="modalSiapkanOpen" x-cloak class="fixed inset-0 z-[5000] flex items-center justify-center bg-black bg-opacity-60 px-4 backdrop-blur-sm" @click.self="tutupModalSiapkan()">
            <div class="bg-white rounded-2xl max-w-sm w-full p-7 text-center shadow-2xl" style="background: linear-gradient(165deg, #1c1c21 0%, #0f0f11 100%); border: 1px solid var(--border-theme);">
                <h3 class="text-lg font-extrabold mb-2" style="color:var(--text-dark);">Verifikasi Packing</h3>
                <p class="text-sm mb-6 font-medium" style="color:var(--text-mid);">Siapkan packingan untuk <strong x-text="namaYangDisiapkan" style="color:#fff;"></strong>?</p>
                <div class="flex justify-around gap-3">
                    <button @click="tutupModalSiapkan()" class="flex-1 py-2.5 font-bold rounded-xl transition text-sm" style="border: 1px solid rgba(255,255,255,0.2); color: var(--text-mid); background:rgba(255,255,255,0.05);">Tidak</button>
                    <button @click="konfirmasiSiapkan()" class="flex-1 py-2.5 text-white font-bold rounded-xl shadow-lg text-sm flex items-center justify-center gap-2" style="background: var(--grad-black); box-shadow: 0 0 0 1px rgba(255,255,255,0.2) inset;">
                        <span x-show="!isPushingSales">Ya, Siapkan</span>
                        <div x-show="isPushingSales" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function showToast(msg, type = 'success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast ${type}`; t.textContent = msg; c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(60px)'; t.style.transition = 'all 0.3s ease'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        const PESANAN_STATUS_API_URL = 'https://script.google.com/macros/s/AKfycbz3V7oaXEBuQAATvcrZsDtGFIXAKTl_h3drbgjksBkJEbFZhjJP2WUSTrPv9mxHm35M/exec';
        const ADMIN_SALES_API_URL = 'https://script.google.com/macros/s/AKfycbxSxXRkkVV793Ws2XivvLfdiw9u1zzsZkLPitM8hhcHmZ2ionKVYLB3HDgo3as4QKnQ9Q/exec';

        function statusCustomerApp() {
            return {
                apiUrl: PESANAN_STATUS_API_URL, statusAppLoading: false, availableSheets: [], statusData: [],
                scSearchNama: '', scSearchTanggal: '', scFilterDari: '', scFilterSheet: '', scFilterStatus: '', scFilterProgress: '', 
                modalSiapkanOpen: false, namaYangDisiapkan: '', isPushingSales: false,

                initStatus() {
                    this.fetchData(false);
                    setInterval(() => { this.fetchData(true); }, 120000); // Auto Sync
                },

                async fetchData(isSilent = false) {
                    if (!isSilent) this.statusAppLoading = true;
                    try {
                        const response = await fetch(`${this.apiUrl}?action=getAllCustomerData`); 
                        const result = await response.json();
                        if (Array.isArray(result)) { this.statusData = result; } 
                        else { this.statusData = []; }
                        
                        const sheets = this.statusData.map(item => item.sheetName); 
                        this.availableSheets = [...new Set(sheets)];
                    } catch (e) { 
                        if (!isSilent) { this.statusData = []; showToast("Gagal memuat data.", "error"); }
                    }
                    if (!isSilent) this.statusAppLoading = false;
                },

                get filteredStatusData() {
                    return this.statusData.filter(c => {
                        const mNama = (c.nama || '').toLowerCase().includes(this.scSearchNama.toLowerCase());
                        const mTanggal = this.scSearchTanggal === '' || (c.tglKirim && c.tglKirim.toLowerCase().includes(this.scSearchTanggal.toLowerCase()));
                        const mDari = this.scFilterDari === '' || (c.dari && c.dari.includes(this.scFilterDari));
                        const mSheet = this.scFilterSheet === '' || c.sheetName === this.scFilterSheet;
                        const mStatus = this.scFilterStatus === '' || c.statusCustomer === this.scFilterStatus;
                        const mProgress = this.scFilterProgress === '' || c.progress === this.scFilterProgress;
                        return mNama && mTanggal && mDari && mSheet && mStatus && mProgress;
                    });
                },

                getCardColor(status) {
                    if (status === 'sudah kirim') return 'bg-green-100 border-green-400 text-green-900';
                    if (status === 'belum di kirim') return 'bg-blue-100 border-blue-400 text-blue-900';
                    if (status === 'kirim jepang') return 'bg-gradient-to-br from-purple-200 to-yellow-200 border-purple-400 text-purple-900';
                    if (status === 'kirim hari ini') return 'bg-orange-100 border-orange-400 text-orange-900';
                    if (status === 'cancel') return 'bg-red-100 border-red-400 text-red-900';
                    return 'bg-white border-gray-200';
                },

                getPillColor(name) {
                    const colors = { 'exata': 'bg-blue-600', 'jastip': 'bg-red-600', 'LPK': 'bg-green-600', 'senior': 'bg-purple-600', 'Affiliate': 'bg-pink-500', 'IG': 'bg-gradient-to-r from-orange-400 to-fuchsia-600', 'FB': 'bg-blue-800', 'tiktok': 'bg-black', 'chatbot': 'bg-teal-500', 'web': 'bg-orange-500' };
                    return colors[name] || 'bg-gray-500';
                },

                bukaModalSiapkan(nama) { this.namaYangDisiapkan = nama || 'Tanpa Nama'; this.modalSiapkanOpen = true; },
                tutupModalSiapkan() { this.modalSiapkanOpen = false; this.namaYangDisiapkan = ''; },
                
                async konfirmasiSiapkan() { 
                    this.isPushingSales = true;
                    const nama = this.namaYangDisiapkan;
                    
                    const newData = { id: Date.now().toString(), nama: nama, tanggal: new Date().toISOString().split('T')[0], status_packing: 'Menunggu', status_kirim: false, note: '' };

                    try {
                        let opsData = JSON.parse(localStorage.getItem('dashOpsData') || '[]');
                        opsData.push(newData);
                        localStorage.setItem('dashOpsData', JSON.stringify(opsData));

                        await fetch(ADMIN_SALES_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'tambah', data: newData }) });
                        showToast(`✅ Data ${nama} berhasil disiapkan untuk Packing!`, 'success'); 
                    } catch (e) {
                        showToast(`✅ Data ${nama} tersimpan secara lokal.`, 'success'); 
                    }
                    
                    this.isPushingSales = false;
                    this.tutupModalSiapkan(); 
                }
            }
        }
    </script>
</body>
</html>
