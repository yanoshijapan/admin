<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Online - Yanoshi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --theme-silver: #E0E0E0; --theme-white: #FFFFFF;
            --grad-black: linear-gradient(135deg, #2b2b2b 0%, #121212 50%, #000000 100%);
            --grad-white: linear-gradient(135deg, #ffffff 0%, #d4d4d4 100%);
            --text-dark: #F3F1EA; --text-mid: #A9A6A0;
            --border-soft: rgba(255,255,255,0.08); --border-theme: rgba(255,255,255,0.25);
        }
        body { font-family: 'Montserrat', sans-serif; background: linear-gradient(180deg, #0A0A0B 0%, #141418 45%, #1B1B20 100%); color: var(--text-dark); min-height: 100vh; }
        [x-cloak] { display: none !important; }
        .icon-svg { display: inline-block; vertical-align: middle; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f0f11; }
        ::-webkit-scrollbar-thumb { background: var(--grad-white); border-radius: 3px; }
        
        #toastContainer { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { padding: 12px 18px; border-radius: 12px; color: white; font-size: 13px; font-weight: 600; font-family: 'Montserrat', sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: auto; animation: toastIn 0.3s ease-out; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast.error   { background: linear-gradient(135deg, #5c0000, #990000); }
        .toast.info    { background: linear-gradient(135deg, #333333, #1a1a1a); }
        
        .upload-zone { border: 2px dashed rgba(255,255,255,0.2) !important; border-radius: 8px; padding: 10px; text-align: center; background: rgba(255,255,255,0.03) !important; transition: border-color 0.2s, background 0.2s; cursor: pointer; }
        .upload-zone:hover { border-color: var(--theme-white) !important; background: rgba(255,255,255,0.08) !important; }
        .upload-zone.has-file { border-color: #34d399 !important; background: rgba(16,185,129,0.08) !important; }
    </style>
</head>
<body x-data="pesananApp()" x-init="initPesanan()">

    <div id="toastContainer"></div>

    <!-- HEADER STICKY BARU (PENCARIAN & FILTER STATUS) -->
    <!-- Di HP akan susun atas-bawah, di Desktop akan menyamping sejajar -->
    <div class="sticky top-0 z-50 p-3 sm:p-4 bg-[#131315] border-b border-[rgba(255,255,255,0.1)] shadow-lg flex flex-col sm:flex-row gap-3 w-full">
        
        <!-- Input Cari -->
        <div class="relative flex-1">
            <input type="text" x-model="searchQuery" placeholder="Cari data pesanan atau nama customer..." class="w-full pl-10 pr-4 py-2.5 sm:py-2 border border-[rgba(255,255,255,0.15)] rounded-lg outline-none transition text-sm font-medium bg-[#0a0a0c] text-white focus:border-yellow-500 shadow-inner">
            <svg class="absolute left-3 top-3 sm:top-2.5 text-gray-500" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        
        <!-- Dropdown Filter Status -->
        <select x-model="statusFilter" class="w-full sm:w-[200px] lg:w-[250px] shrink-0 px-4 py-2.5 sm:py-2 border border-[rgba(255,255,255,0.15)] rounded-lg outline-none transition text-xs sm:text-sm font-black uppercase tracking-wider cursor-pointer bg-[#1b1b20] text-yellow-500 focus:border-yellow-500 shadow-sm">
            <option value="" class="text-white bg-[#1b1b20]">Semua Status</option>
            <template x-for="st in statusOptions">
                <option :value="st" x-text="st" class="text-white bg-[#1b1b20]"></option>
            </template>
        </select>
        
    </div>

    <!-- CONTENT AREA -->
    <div class="max-w-7xl mx-auto p-4 md:p-6 w-full">

        <!-- Loading Spinner -->
        <div x-show="loading" class="flex justify-center items-center py-16">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-500"></div>
        </div>

        <!-- Grid Data -->
        <div class="grid grid-cols-1 gap-6 pb-10" x-show="!loading" x-cloak>
            <template x-for="item in filteredData" :key="item.row">
                <div class="rounded-xl shadow-sm border border-l-4 hover:shadow-md transition p-5 relative break-words" style="background:#1b1b20; border-color:rgba(255,255,255,0.08); border-left-color: var(--theme-silver);">

                    <!-- Header Kartu -->
                    <div class="flex justify-between items-start mb-4 border-b pb-4 gap-4" style="border-color: rgba(255,255,255,0.08);">
                        <div>
                            <span class="text-[10px] uppercase font-bold text-gray-400 tracking-wider" x-text="'ID: ' + item.orderId"></span>
                            <h2 class="text-lg font-extrabold leading-tight mt-0.5" style="color:var(--text-dark);" x-text="item.customer"></h2>
                            <p class="text-xs font-medium mt-1" style="color:var(--text-mid);" x-text="pFormatDate(item.tglOrder)"></p>
                        </div>
                        <div class="text-right flex flex-col items-end gap-2 shrink-0">
                            <button @click="pDeleteData(item.row, item.customer)"
                                    class="text-[10px] px-3 py-1.5 rounded-md font-bold transition" style="background: rgba(255,255,255,0.05); color: #fff;">
                                <svg class="icon-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:2px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> HAPUS
                            </button>
                            <!-- Pilihan Update Status Cepat -->
                            <select @change="pUpdateStatus(item.row, $event.target.value)"
                                    :class="pGetStatusColor(item.status)"
                                    class="text-xs font-bold px-4 py-1.5 rounded-full border-none cursor-pointer focus:ring-2 focus:ring-white outline-none mt-1">
                                <template x-for="st in statusOptions">
                                    <option :value="st" x-text="st" :selected="st === item.status"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <!-- Detail Info 3 Kolom -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">

                        <!-- Kolom Kiri: Kontak & Pesanan -->
                        <div class="space-y-3">
                            <div class="flex items-center font-semibold text-[13px]" style="color:#10b981;">
                                <span class="mr-2"><svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span> <span x-text="item.whatsapp"></span>
                            </div>
                            <div class="p-3.5 rounded-xl border" style="background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.08);">
                                <div class="flex justify-between items-center cursor-pointer" @click="item.showItems = !item.showItems">
                                    <span class="font-bold text-[11px] uppercase tracking-wide" style="color:var(--text-mid);">List Pesanan</span>
                                    <svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#8a8985;" :style="{transform: item.showItems ? 'rotate(180deg)' : 'rotate(0deg)', transition:'transform .2s'}"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </div>
                                <div x-show="item.showItems" x-cloak class="mt-3 text-[13px] leading-relaxed break-all whitespace-pre-wrap" style="color:var(--text-dark);" x-html="item.listPesanan"></div>
                            </div>
                        </div>

                        <!-- Kolom Tengah: Aksi Invoice & Resi -->
                        <div class="space-y-3">
                            <button @click="pCopyFormat(item)" class="w-full py-2.5 text-black rounded-lg font-bold text-xs transition shadow-sm" style="background: var(--grad-white);">
                                📋 COPY FORMAT ORDER
                            </button>

                            <div class="border rounded-xl p-3.5 space-y-3" style="background:rgba(255,255,255,0.02); border-color:rgba(255,255,255,0.08);">
                                <div class="flex justify-between items-center">
                                    <span class="text-[11px] font-bold tracking-wide" style="color:var(--text-mid);">📄 INVOICE</span>
                                    <div class="flex items-center gap-2">
                                        <template x-if="item.invoice">
                                            <a :href="item.invoice" target="_blank" class="hover:text-white underline text-[11px] font-semibold" style="color:var(--theme-silver);">Buka Link ↗</a>
                                        </template>
                                        <button @click="pOpenModal(item.row, 15, 'Input Link Invoice')"
                                                class="text-[10px] px-2.5 py-1 rounded-md font-bold transition" style="background: rgba(255,255,255,0.1); color: #fff;">
                                            LINK
                                        </button>
                                    </div>
                                </div>

                                <div class="upload-zone rounded-lg" :class="{'has-file': item._invoiceFile}"
                                     @dragover.prevent @drop.prevent="pHandleDrop($event, item, 'invoice')"
                                     @click="document.getElementById('inv_' + item.row).click()">
                                    <input type="file" :id="'inv_' + item.row" accept=".pdf,image/*" @change="pHandleFileSelect($event, item, 'invoice')">
                                    <template x-if="!item._invoiceFile">
                                        <p class="text-[11px] leading-tight" style="color:var(--text-mid);">🔼 Klik / Drop File Invoice<br><span class="text-[10px] opacity-75">(PDF atau Gambar)</span></p>
                                    </template>
                                    <template x-if="item._invoiceFile">
                                        <div class="text-[11px] font-semibold truncate px-2" style="color:#10b981;" x-text="'✅ ' + item._invoiceFile.name"></div>
                                    </template>
                                </div>
                                <button @click="pUploadFile(item, 'invoice')"
                                        :disabled="!item._invoiceFile || item._uploadingInvoice"
                                        :class="item._invoiceFile ? 'shadow-sm' : 'cursor-not-allowed'"
                                        class="w-full py-2 rounded-lg text-[11px] font-bold transition"
                                        :style="item._invoiceFile ? 'background:var(--grad-white);color:#000;' : 'background:rgba(255,255,255,0.1);color:#8a8985;'">
                                    <span x-text="item._uploadingInvoice ? '⏳ Mengupload...' : '📤 Upload Invoice ke Drive'"></span>
                                </button>
                            </div>

                            <div class="flex justify-between items-center border-b pb-2" style="border-color: rgba(255,255,255,0.08);">
                                <span class="text-[11px] font-bold tracking-wide" style="color:var(--text-mid);">💳 BUKTI BAYAR</span>
                                <div class="flex items-center gap-2">
                                    <template x-if="item.buktiBayar">
                                        <a :href="item.buktiBayar" target="_blank" class="hover:text-white underline text-[11px] font-semibold" style="color:var(--theme-silver);">Buka Link ↗</a>
                                    </template>
                                    <button @click="pOpenModal(item.row, 16, 'Input Link Bukti Bayar')"
                                            class="text-[10px] px-2.5 py-1 rounded-md font-bold transition" style="background: rgba(255,255,255,0.1); color: #fff;">
                                        INPUT
                                    </button>
                                </div>
                            </div>

                            <div class="flex justify-between items-center pt-1 gap-3">
                                <span class="text-[11px] font-bold tracking-wide whitespace-nowrap" style="color:var(--text-mid);">📦 RESI</span>
                                <span x-text="item.resi || '-'" class="text-xs font-mono break-all text-right flex-1" style="color:var(--text-dark);"></span>
                                <button @click="pOpenModal(item.row, 17, 'Input No Resi')"
                                        class="text-[10px] px-2.5 py-1 rounded-md font-bold whitespace-nowrap transition" style="background: rgba(255,255,255,0.1); color: #fff;">
                                    INPUT
                                </button>
                            </div>
                        </div>

                        <!-- Kolom Kanan: Pengiriman & Ongkir -->
                        <div class="text-[13px] p-4 rounded-xl border flex flex-col justify-between shadow-sm" style="background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.1);">
                            <div>
                                <p class="font-extrabold mb-2 text-[11px] tracking-wide" style="color:#fff;">INFO PENGIRIMAN</p>
                                <p style="color:var(--text-dark);"><b x-text="item.penerima"></b> <span style="color:#666;" class="mx-1">|</span> <span x-text="item.noPenerima"></span></p>
                                <p class="mt-1.5 italic leading-relaxed" style="color:var(--text-mid);" x-text="item.alamat"></p>
                                <p class="mt-4 font-bold text-xs" style="color:var(--text-mid);">Tanggal Kirim: <span style="color:var(--text-dark);" x-text="pFormatDate(item.tglKirim)"></span></p>
                            </div>
                            <div class="mt-4 pt-3 border-t flex justify-between items-center" style="border-color:rgba(255,255,255,0.1);">
                                <span class="font-extrabold text-[11px] tracking-wide" style="color:#fff;">ONGKOS KIRIM:</span>
                                <template x-if="item.ongkir">
                                    <div class="flex items-center space-x-2">
                                        <span x-text="pFormatRupiah(item.ongkir)" class="font-extrabold text-[15px]" style="color:var(--text-dark);"></span>
                                        <button @click="pOpenModal(item.row, 7, 'Edit Ongkos Kirim', item.ongkir)"
                                                class="text-[10px] underline hover:text-white font-semibold" style="color:var(--theme-silver);">Edit</button>
                                    </div>
                                </template>
                                <template x-if="!item.ongkir">
                                    <button @click="pOpenModal(item.row, 7, 'Input Ongkos Kirim (Angka saja)')"
                                            class="text-[10px] text-white px-3 py-1.5 rounded-md shadow-sm font-bold transition transform hover:-translate-y-0.5 border border-white/20" style="background:rgba(255,255,255,0.1);">
                                        INPUT ONGKIR
                                    </button>
                                </template>
                            </div>
                        </div>

                    </div>
                </div>
            </template>

            <!-- Pesan Jika Kosong -->
            <div x-show="!loading && filteredData.length === 0" class="text-center py-12 text-gray-500 font-bold text-xs uppercase tracking-widest flex flex-col items-center">
                <span class="text-4xl mb-2 block">📭</span> Data pesanan tidak ditemukan.
            </div>
        </div>

        <!-- MODAL GLOBAL UNTUK EDIT DATA -->
        <div x-show="pModalOpen" x-cloak class="fixed inset-0 z-[5000] flex items-center justify-center bg-black bg-opacity-70 px-4 backdrop-blur-md" @click.self="pModalOpen = false">
            <div class="bg-white rounded-2xl max-w-sm w-full p-7 shadow-2xl transform transition-all scale-100" style="background: linear-gradient(165deg, #1c1c21 0%, #0f0f11 100%); border: 1px solid var(--border-theme);">
                <h3 class="text-lg font-extrabold mb-5" style="color:var(--text-dark);" x-text="pModalTitle"></h3>
                <input type="text" x-model="pModalValue" class="w-full px-4 py-3 rounded-xl mb-6 outline-none transition text-sm font-medium" style="background:rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.14); color:var(--text-dark);">
                <div class="flex justify-end space-x-3">
                    <button @click="pModalOpen = false" class="px-5 py-2.5 font-bold text-sm rounded-xl transition" style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); color:var(--text-mid);">BATAL</button>
                    <button @click="pSubmitModal()" class="px-6 py-2.5 text-black rounded-xl font-black shadow-lg transition bg-yellow-500 hover:bg-yellow-400 text-xs">SIMPAN</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function showToast(msg, type = 'success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast ${type}`; t.textContent = msg; c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(60px)'; t.style.transition = 'all 0.3s ease'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        function pFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload  = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // URL API ANDA YANG ASLI
        const PESANAN_STATUS_API_URL = 'https://script.google.com/macros/s/AKfycbz3V7oaXEBuQAATvcrZsDtGFIXAKTl_h3drbgjksBkJEbFZhjJP2WUSTrPv9mxHm35M/exec';
        const P_API_UPLOAD = 'https://script.google.com/macros/s/AKfycbx7w2FXv0ayhq61Le63K7zJsb-znvXq6cjLcLO6shrECvOwN-lF3vBO3-pn1dRCX6dH/exec'; 

        function pesananApp() {
            return {
                apiUrl: PESANAN_STATUS_API_URL, uploadUrl: P_API_UPLOAD, loading: true, allData: [], searchQuery: '', statusFilter: '', statusOptions: ['menunggu', 'DRAFT', 'Verifying', 'Sudah Bayar', 'Sudah Kirim', 'SENT', 'READY'], pModalOpen: false, pModalTitle: '', pModalValue: '', activeRow: null, activeCol: null,
                
								
								initPesanan() { 
                    this.fetchData(false); 
                    setInterval(() => { this.fetchData(true); }, 120000); // Auto Sync
                },
                
                async fetchData(isSilent = false) {
                    if (!isSilent) this.loading = true; // Loading hanya muncul saat pertama kali buka
                    try {
                        const response = await fetch(`${this.apiUrl}?action=read`); 
                        let data = await response.json();
                        data.sort((a, b) => { const dA = new Date(a.tglOrder).getTime(); const dB = new Date(b.tglOrder).getTime(); return dB - dA; });
                        
                        // KUNCI PENTING: Menggabungkan data baru tanpa merusak aktivitas klik/upload user saat ini
                        this.allData = data.map(newItem => {
                            const existingItem = this.allData.find(oldItem => oldItem.row === newItem.row);
                            return { 
                                ...newItem, 
                                showItems: existingItem ? existingItem.showItems : false, 
                                _invoiceFile: existingItem ? existingItem._invoiceFile : null, 
                                _uploadingInvoice: existingItem ? existingItem._uploadingInvoice : false 
                            };
                        });
                    } catch (e) { 
                        if (!isSilent) showToast('Gagal memuat data pesanan!', 'error'); 
                    }
                    if (!isSilent) this.loading = false;
                },
                
                async fetchData() {
                    this.loading = true;
                    try {
                        const response = await fetch(`${this.apiUrl}?action=read`); let data = await response.json();
                        data.sort((a, b) => { const dA = new Date(a.tglOrder).getTime(); const dB = new Date(b.tglOrder).getTime(); if (isNaN(dA)) return 1; if (isNaN(dB)) return -1; return dB - dA; });
                        this.allData = data.map(item => ({ ...item, showItems: false, _invoiceFile: null, _uploadingInvoice: false }));
                    } catch (e) { showToast('Gagal memuat data pesanan!', 'error'); }
                    this.loading = false;
                },
                
                get filteredData() {
                    return this.allData.filter(i => { 
                        // Perbaikan pencarian: mencari nama ATAU order ID
                        const matchSearch = i.customer.toLowerCase().includes(this.searchQuery.toLowerCase()) || i.orderId.toString().includes(this.searchQuery); 
                        const matchStatus = this.statusFilter === '' || i.status === this.statusFilter; 
                        return matchSearch && matchStatus; 
                    });
                },
                
                pHandleFileSelect(event, item, type) { const file = event.target.files[0]; if (!file) return; this.pAssignFile(item, file); },
                pHandleDrop(event, item, type) { const file = event.dataTransfer.files[0]; if (!file) return; if (!file.type.startsWith('image/') && file.type !== 'application/pdf') { showToast('Format tidak didukung. Gunakan PDF atau Gambar.', 'error'); return; } this.pAssignFile(item, file); },
                pAssignFile(item, file) { const idx = this.allData.findIndex(i => i.row === item.row); if (idx === -1) return; this.allData[idx]._invoiceFile = file; },
                
                async pUploadFile(item, type) {
                    const idx  = this.allData.findIndex(i => i.row === item.row); const file = item._invoiceFile;
                    if (!file) { showToast('Pilih file terlebih dahulu!', 'error'); return; }
                    this.allData[idx]._uploadingInvoice = true;
                    try {
                        const base64  = await pFileToBase64(file); const payload = { action: 'uploadInvoice', row: item.row, fileName: file.name, fileData: base64, mimeType: file.type };
                        const response = await fetch(this.uploadUrl, { method: 'POST', body: JSON.stringify(payload) }); const result   = await response.json();
                        if (result.success) { showToast('Invoice berhasil diupload! ✅', 'success'); this.allData[idx]._invoiceFile = null; await this.fetchData(); } else { throw new Error(result.message || 'Upload gagal'); }
                    } catch (err) { showToast('Upload gagal: ' + err.message, 'error'); } finally { this.allData[idx]._uploadingInvoice = false; }
                },
                
                async pUpdateStatus(row, val) { await fetch(`${this.apiUrl}?action=update&row=${row}&col=8&val=${encodeURIComponent(val)}`); this.fetchData(); },
                pOpenModal(row, col, title, currentValue = '') { this.activeRow = row; this.activeCol = col; this.pModalTitle = title; this.pModalValue = currentValue; this.pModalOpen = true; },
                async pSubmitModal() { this.pModalOpen = false; this.loading = true; await fetch(`${this.apiUrl}?action=update&row=${this.activeRow}&col=${this.activeCol}&val=${encodeURIComponent(this.pModalValue)}`); this.fetchData(); },
                async pDeleteData(row, customerName) { if (!confirm(`PERINGATAN!\nApakah Anda yakin menghapus data milik: ${customerName}?`)) return; this.loading = true; try { await fetch(`${this.apiUrl}?action=delete&row=${row}`); await this.fetchData(); showToast(`Data dihapus.`, 'info'); } catch (e) { showToast('Kesalahan hapus data.', 'error'); } },
                
                pCopyFormat(i) {
                    const text = `*FORMAT PEMESANAN* :\nNama Customer : ${i.customer}\nNo Whatsapp : ${i.whatsapp}\n\n*INFO PENGIRIMAN* :\nNama Penerima : ${i.penerima}\nNomor Penerima : ${i.noPenerima}\nAlamat Pengiriman : ${i.alamat}\nRequest Kirim Tanggal : ${this.pFormatDate(i.tglKirim)}\n\nList Pesanan :\n${i.listPesanan}`;
                    navigator.clipboard.writeText(text); showToast('Format Order disalin! 📋', 'info');
                },
                
                pFormatDate(dateStr) { if (!dateStr) return '-'; return new Date(dateStr).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); },
                pFormatRupiah(angka) { if (!angka || isNaN(angka)) return angka; return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); },
                
                pGetStatusColor(status) {
                    const c = { 'menunggu': 'bg-gray-200 text-gray-700', 'DRAFT': 'bg-orange-100 text-orange-700', 'Verifying': 'bg-blue-100 text-blue-700', 'Sudah Bayar': 'bg-green-100 text-green-700', 'READY': 'bg-yellow-400 text-black', 'SENT': 'bg-purple-100 text-purple-700' };
                    return c[status] || 'bg-red-100 text-red-700';
                }
            };
        }
    </script>
</body>
